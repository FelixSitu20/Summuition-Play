name: Publish Summuition guest game
on:
  push:
    branches: [main]
    paths: ['guest/**', 'tests/**', '.gitattributes', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify public guest payload and relative paths
        run: python3 tests/verify-publication.py
      - name: Verify mobile display and unchanged compiled game
        run: node tests/display.test.cjs
      - name: Verify session gate and isolated owner control
        run: |
          node tests/session-control.test.cjs
          python3 tests/owner-control.test.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: guest
      - name: Wait for uploaded Pages artifact visibility
        shell: python3 {0}
        run: |
          import json, os, time, urllib.request
          repository = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          commit = os.environ["GITHUB_SHA"]
          endpoint = f"https://api.github.com/repos/{repository}/actions/runs/{run_id}/artifacts"
          for attempt in range(12):
              request = urllib.request.Request(endpoint + f"?per_page=100&check={attempt}",
                  headers={"User-Agent": "Summuition-Pages-verification", "Cache-Control": "no-cache"})
              try:
                  with urllib.request.urlopen(request, timeout=10) as response:
                      artifacts = json.load(response).get("artifacts", [])
                  matches = [item for item in artifacts if item.get("name") == "github-pages"
                      and not item.get("expired", True)
                      and item.get("workflow_run", {}).get("head_sha") == commit]
                  if len(matches) == 1:
                      print("Uploaded artifact is visible for this exact commit.")
                      time.sleep(5)
                      break
              except Exception as error:
                  print(f"Artifact metadata is not ready: {type(error).__name__}")
              time.sleep(5)
          else:
              raise SystemExit("Uploaded Pages artifact did not become visible; deployment held.")
      - name: Deploy public guest game
        id: deployment
        uses: actions/deploy-pages@v4
