name: Restore Summuition guest link
on:
  push:
    branches: [main]
    paths: ['redirect/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify redirect-only payload
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          from html.parser import HTMLParser
          root = pathlib.Path('redirect')
          target = 'https://summuition-guest.cabledchime5.chatgpt.site/'
          manifest = json.loads((root/'publication-manifest.json').read_text())
          assert manifest['product'] == 'Summuition'
          assert manifest['publicationMode'] == 'public-guest-redirect'
          assert manifest['targetUrl'] == target
          assert manifest['schoolAuthentication'] is False
          assert manifest['payloadContainsUnitySource'] is False
          assert {entry['path'] for entry in manifest['files']} == {'index.html', '.nojekyll'}
          assert len(manifest['files']) == 2
          for entry in manifest['files']:
              file = root/entry['path']
              assert not file.is_symlink() and file.is_file()
              assert file.stat().st_size == entry['bytes']
              assert hashlib.sha256(file.read_bytes()).hexdigest() == entry['sha256']
          assert {p.relative_to(root).as_posix() for p in root.rglob('*')} == {'index.html', '.nojekyll', 'publication-manifest.json'}
          html = (root/'index.html').read_text()
          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refresh = []
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'meta' and attrs.get('http-equiv') == 'refresh':
                      self.refresh.append(attrs.get('content'))
                  if tag == 'a':
                      self.links.append(attrs.get('href'))
          page = Links()
          page.feed(html)
          assert page.refresh == ['0; url=' + target]
          assert page.links == [target]
          assert 'window.location.replace("' + target + '")' in html
          assert sum(p.stat().st_size for p in root.iterdir()) < 16*1024
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirect
      - name: Deploy guest redirect
        id: deployment
        uses: actions/deploy-pages@v4
