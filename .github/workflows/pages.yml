name: Publish Summuition guest game
on:
  push:
    branches: [main]
    paths: ['guest/**', 'tests/**', '.gitattributes', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify public guest payload and relative paths
        run: python3 tests/verify-publication.py
      - name: Verify mobile display and unchanged compiled game
        run: node tests/display.test.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: guest
      - name: Deploy public guest game
        id: deployment
        uses: actions/deploy-pages@v4
