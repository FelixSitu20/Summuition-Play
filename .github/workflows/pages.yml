name: Publish Summuition guest game
on:
  push:
    branches: [main]
    paths: ['guest/**', 'tests/**', '.gitattributes', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify public guest payload and relative paths
        run: python3 tests/verify-publication.py
      - name: Verify mobile display and unchanged compiled game
        run: node tests/display.test.cjs
      - name: Verify session gate and isolated owner control
        run: |
          node tests/session-control.test.cjs
          python3 tests/owner-control.test.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        id: upload
        with:
          path: guest
      - name: Verify uploaded Pages artifact identity
        shell: python3 {0}
        env:
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          import json, os, time, urllib.error, urllib.request
          repository = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          commit = os.environ["GITHUB_SHA"]
          expected_id = int(os.environ["PAGES_ARTIFACT_ID"])
          endpoint = f"https://api.github.com/repos/{repository}/actions/runs/{run_id}/artifacts"
          last = "No response yet"
          for attempt in range(12):
              request = urllib.request.Request(endpoint + f"?per_page=100&check={attempt}",
                  headers={"User-Agent": "Summuition-Pages-verification", "Cache-Control": "no-cache",
                      "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"})
              try:
                  with urllib.request.urlopen(request, timeout=10) as response:
                      artifacts = json.load(response).get("artifacts", [])
                      observed = [{key: item.get(key) for key in ("id", "name", "expired", "size_in_bytes")}
                          for item in artifacts]
                      last = f"HTTP {response.status}; request {response.headers.get('X-GitHub-Request-Id', 'unknown')}; artifacts {json.dumps(observed)}"
                  print(last, flush=True)
                  matches = [item for item in artifacts if item.get("id") == expected_id
                      and item.get("name") == "github-pages" and not item.get("expired", True)
                      and item.get("size_in_bytes", 0) > 0]
                  if len(matches) == 1:
                      provenance = matches[0].get("workflow_run") or {}
                      if provenance.get("id", int(run_id)) != int(run_id) or provenance.get("head_sha", commit) != commit:
                          raise SystemExit("::error::Uploaded artifact has conflicting run/commit provenance; deployment held.")
                      print("Verified exact uploaded artifact ID in this workflow run.", flush=True)
                      time.sleep(5)
                      break
              except urllib.error.HTTPError as error:
                  last = f"HTTP {error.code}; request {error.headers.get('X-GitHub-Request-Id', 'unknown')}"
                  print(last, flush=True)
              except (urllib.error.URLError, TimeoutError, json.JSONDecodeError) as error:
                  last = f"Metadata read failed: {type(error).__name__}"
                  print(last, flush=True)
              time.sleep(5)
          else:
              print(f"::error::Artifact {expected_id} not visible for run {run_id}; {last}", flush=True)
              raise SystemExit(1)
      - name: Deploy public guest game
        id: deployment
        uses: actions/deploy-pages@v4
