/* Compact exit icon uses the free top-right corner, not a canvas-shrinking row. */
#player:fullscreen #toolbar{position:absolute;z-index:10;top:2px;right:2px;min-height:0;padding:0;justify-content:flex-end}
#player:fullscreen #toolbar span{display:none}
#player:fullscreen #fullscreen{width:28px;min-width:28px;height:28px;min-height:28px;padding:4px;line-height:1}
#player:fullscreen #fullscreen{background:#3b3d40ed}
#player:fullscreen #fullscreen:before{border-width:3px;border-left-width:4px;border-right-width:4px}
#player:fullscreen #fullscreen svg{display:block;width:20px;height:20px;fill:currentColor}
/* Keep guidance and controls separate on unusually narrow/portrait screens. */
@media(max-width:520px),(orientation:portrait){#player:fullscreen #toolbar{position:relative;top:auto;right:auto;min-height:32px;padding:2px 6px}}
@media(max-width:900px) and (orientation:portrait){#rotate{display:block}#stage{align-items:start;padding-top:12px}#toolbar{padding-inline:12px}#toolbar span{max-width:14rem;font-size:15px}button{padding-inline:20px}}

<body>
<main id="player">
<div id="toolbar"><span id="display-hint" role="status"></span><button id="fullscreen" type="button">Fullscreen</button></div>
<section id="rotate" aria-label="Phone display guidance"><strong>Turn your phone sideways</strong><p>Summuition plays in landscape.</p></section>
<div id="stage"><div id="game"><canvas id="canvas" width="1280" height="800" tabindex="0" aria-label="Summuition arithmetic game"></canvas><div id="status"><section class="loading-panel"><h1 class="loading-title">SUMMUITION</h1><p id="message">Loading Summuition.</p><div id="loading-track"><progress id="progress" max="1" value="0" aria-label="Game loading progress"></progress><div class="timeline" aria-hidden="true"><div class="fill" id="fill"></div><div class="diamond" id="diamond"><span id="percent">0</span></div></div></div></section></div></div></div>
</main>
<script src="../session-control.js"></script>
<script>
'use strict';
const player=document.getElementById('player');
const stage=document.getElementById('stage');
const game=document.getElementById('game');
const canvas=document.getElementById('canvas');
const statusPanel=document.getElementById('status');
const message=document.getElementById('message');
const fullscreenButton=document.getElementById('fullscreen');
const displayHint=document.getElementById('display-hint');
let shownProgress=0;
function showProgress(value){if(!Number.isFinite(value))return;shownProgress=Math.max(shownProgress,Math.max(0,Math.min(1,value)));const percent=Math.floor(shownProgress*100);document.getElementById('progress').value=shownProgress;document.getElementById('fill').style.width='calc('+(shownProgress*100)+'% - '+(shownProgress*6)+'px)';document.getElementById('diamond').style.left=(shownProgress*100)+'%';document.getElementById('percent').textContent=String(percent);}
let unityInstance=null;
let renderPixelRatio=1;
let fullscreenPending=false;
// Honor high-density phones without allowing an unbounded render target.
function fitGame(){
  const stageStyle=getComputedStyle(stage);
  const availableWidth=Math.max(1,stage.clientWidth);
  const availableHeight=Math.max(1,stage.clientHeight-parseFloat(stageStyle.paddingTop||0)-parseFloat(stageStyle.paddingBottom||0));
  const width=Math.min(availableWidth,availableHeight*8/5);
  const height=width*5/8;
  game.style.width=width+'px';
  game.style.height=height+'px';
  renderPixelRatio=Math.min(window.devicePixelRatio||1,3,Math.sqrt(4000000/(width*height)));
  if(unityInstance)unityInstance.Module.devicePixelRatio=renderPixelRatio;
}
function syncFullscreen(){
  const active=!!document.fullscreenElement;
  if(active)fullscreenButton.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 16H3v2h5v-5H6v3zm-3-8h3v3h2V6H3v2zm13 10h5v-2h-3v-3h-2v5zm2-10h3V6h-5v5h2V8z"/></svg>';
  else fullscreenButton.textContent='Fullscreen';
  fullscreenButton.ariaLabel=active?'Exit fullscreen':'Enter fullscreen';
  fullscreenButton.title=active?'Exit fullscreen (Esc)':'Fullscreen';
  fitGame();
}
async function toggleFullscreen(){
  if(fullscreenPending)return;
  fullscreenPending=true;
  fullscreenButton.disabled=true;
  try{
    if(document.fullscreenElement){
      await document.exitFullscreen();
    }else if(player.requestFullscreen){
      await player.requestFullscreen();
      if(window.matchMedia('(pointer:coarse)').matches && screen.orientation && screen.orientation.lock){
        try{await screen.orientation.lock('landscape');}
        catch{displayHint.textContent='Turn your phone sideways for the largest view.';}
      }
    }else{
      displayHint.textContent='Fullscreen is unavailable here. Turn your phone sideways for a larger view.';
    }
  }catch{
    displayHint.textContent='Fullscreen was not available. Turn your phone sideways or open this link in your browser.';
  }finally{
    fullscreenPending=false;
    fullscreenButton.disabled=false;
    syncFullscreen();
    canvas.focus({preventScroll:true});
  }
}
fullscreenButton.addEventListener('click',toggleFullscreen);
document.addEventListener('fullscreenchange',syncFullscreen);
window.addEventListener('resize',fitGame);
if(window.visualViewport)window.visualViewport.addEventListener('resize',fitGame);
if(typeof ResizeObserver!=='undefined')new ResizeObserver(fitGame).observe(stage);
fitGame();
const fail=()=>{statusPanel.style.display='grid';message.textContent='The game could not load. Please reload or ask your teacher to check browser access.';document.getElementById('progress').hidden=true;document.getElementById('loading-track').hidden=true;};
function startGame(){
const script=document.createElement('script');
script.src='Build/27ced21524e795b85c805b5a14560686.loader.js';
script.onerror=fail;
script.onload=()=>createUnityInstance(canvas,{
  dataUrl:'Build/d81391fa8882083a1c8dee0d69c1ccc0.data.unityweb',
  frameworkUrl:'Build/ed228ac7383910e59bbd94d2588d490e.framework.js.unityweb',
  codeUrl:'Build/7911211ba555eddd6127fc9100f3f5f7.wasm.unityweb',
  companyName:'Summuition',productName:'Summuition',productVersion:'1.0',
  devicePixelRatio:renderPixelRatio,matchWebGLToCanvasSize:true,
  cacheControl:()=> 'no-store'
},showProgress).then(instance=>{
  if(!sessionGate.isActive()){if(instance.Quit)instance.Quit();return;}
  showProgress(1);
  unityInstance=instance;
  fitGame();
  statusPanel.style.display='none';
  canvas.focus({preventScroll:true});
}).catch(fail);
document.body.appendChild(script);
}
function endSession(reason){
  // Navigation destroys the Unity document and audio; downloaded copies are outside this control.
  canvas.style.visibility='hidden';
  fullscreenButton.disabled=true;
  if(unityInstance&&unityInstance.Quit){try{Promise.resolve(unityInstance.Quit()).catch(()=>{});}catch{}}
  window.location.replace('../session-ended.html?reason='+encodeURIComponent(reason));
}
const sessionGate=window.SummSessionControl?window.SummSessionControl.create({
  onAllowed:startGame,
  onDenied:endSession,
  onStatus:text=>{if(!unityInstance)message.textContent=text==='Session open.'?'Loading Summuition.':text;}
}):null;
if(sessionGate){
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)sessionGate.recheck();});
  window.addEventListener('pageshow',()=>sessionGate.recheck());
  window.addEventListener('online',()=>sessionGate.recheck());
  sessionGate.start();
}else{
  endSession('unreachable');
}
</script>
</body>
