#rotate strong{display:block;color:#f2eee4;font-size:25px;margin-bottom:6px}

<main id="player">
<div id="toolbar"><span id="display-hint" role="status"></span><button id="fullscreen" type="button">Fullscreen</button></div>
<section id="rotate" aria-label="Phone display guidance"><strong>Turn your phone sideways</strong><p>Summuition plays in landscape.</p></section>
<div id="stage"><div id="game"><canvas id="canvas" width="1280" height="800" tabindex="0" aria-label="Summuition arithmetic game"></canvas><div id="status"><p id="message">Loading Summuition.</p><progress id="progress" max="1" value="0"></progress></div></div></div>
</main>
<script>
'use strict';
const player=document.getElementById('player');
const stage=document.getElementById('stage');
const game=document.getElementById('game');
const canvas=document.getElementById('canvas');
const statusPanel=document.getElementById('status');
const message=document.getElementById('message');
const fullscreenButton=document.getElementById('fullscreen');
const displayHint=document.getElementById('display-hint');
let unityInstance=null;
let renderPixelRatio=1;
let fullscreenPending=false;
// Honor high-density phones without allowing an unbounded render target.
function fitGame(){
  const stageStyle=getComputedStyle(stage);
  const availableWidth=Math.max(1,stage.clientWidth);
  const availableHeight=Math.max(1,stage.clientHeight-parseFloat(stageStyle.paddingTop||0)-parseFloat(stageStyle.paddingBottom||0));
  const width=Math.min(availableWidth,availableHeight*8/5);
  const height=width*5/8;
  game.style.width=width+'px';
  game.style.height=height+'px';
  renderPixelRatio=Math.min(window.devicePixelRatio||1,3,Math.sqrt(4000000/(width*height)));
  if(unityInstance)unityInstance.Module.devicePixelRatio=renderPixelRatio;
}
function syncFullscreen(){
  fullscreenButton.textContent=document.fullscreenElement?'Exit fullscreen':'Fullscreen';
  fitGame();
}
async function toggleFullscreen(){
  if(fullscreenPending)return;
  fullscreenPending=true;
  fullscreenButton.disabled=true;
  try{
    if(document.fullscreenElement){
      await document.exitFullscreen();
    }else if(player.requestFullscreen){
      await player.requestFullscreen();
      if(window.matchMedia('(pointer:coarse)').matches && screen.orientation && screen.orientation.lock){
        try{await screen.orientation.lock('landscape');}
        catch{displayHint.textContent='Turn your phone sideways for the largest view.';}
      }
    }else{
      displayHint.textContent='Fullscreen is unavailable here. Turn your phone sideways for a larger view.';
    }
  }catch{
    displayHint.textContent='Fullscreen was not available. Turn your phone sideways or open this link in your browser.';
  }finally{
    fullscreenPending=false;
    fullscreenButton.disabled=false;
    syncFullscreen();
    canvas.focus({preventScroll:true});
  }
}
fullscreenButton.addEventListener('click',toggleFullscreen);
document.addEventListener('fullscreenchange',syncFullscreen);
window.addEventListener('resize',fitGame);
if(window.visualViewport)window.visualViewport.addEventListener('resize',fitGame);
if(typeof ResizeObserver!=='undefined')new ResizeObserver(fitGame).observe(stage);
fitGame();
const fail=()=>{statusPanel.style.display='grid';message.textContent='The game could not load. Please reload or ask your teacher to check browser access.';document.getElementById('progress').hidden=true;};
const script=document.createElement('script');
script.src='Build/9e807b12ae1919b75ddfacdeefc9b0b5.loader.js';
script.onerror=fail;
script.onload=()=>createUnityInstance(canvas,{
  dataUrl:'Build/be6dcb69ebc70856fe607123d9cdfd4f.data.unityweb',
  frameworkUrl:'Build/01930e1a648d25a0ae44e06207cdbe94.framework.js.unityweb',
  codeUrl:'Build/91643ecd044cb6df69560ef6c1495535.wasm.unityweb',
  companyName:'Summuition',productName:'Summuition',productVersion:'1.0',
  devicePixelRatio:renderPixelRatio,matchWebGLToCanvasSize:true,
  cacheControl:()=> 'no-store'
},p=>document.getElementById('progress').value=p).then(instance=>{
  unityInstance=instance;
  fitGame();
  statusPanel.style.display='none';
  canvas.focus({preventScroll:true});
}).catch(fail);
document.body.appendChild(script);
</script>
</body>
